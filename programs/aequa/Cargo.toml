[package]
name = "aequa"
version = "0.1.0"
description = "USDq: a dollar backed by tokenized S&P 500 and Nasdaq-100 ETFs, hedged with short index perps"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "aequa"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.1", default-features = false, features = ["solana-v4", "init-if-needed"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["solana-v4", "token", "token_2022", "token_2022_extensions", "associated_token"] }
uint = { version = "0.10", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
